<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Your confirmation code</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f3f0e8">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f3f0e8">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #fbf9f4; border: 1px solid #dcd8cc; border-radius: 16px"
          >
            <tr>
              <td
                style="
                  padding: 32px 28px;
                  font-family:
                    Figtree,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    Arial,
                    sans-serif;
                  color: #1f211c;
                "
              >
                <p style="margin: 0 0 24px; font-family: Georgia, serif; font-size: 28px; color: #56633f">babble</p>
                <h1 style="margin: 0 0 12px; font-size: 22px; line-height: 28px; font-weight: 700">Confirm it's you</h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 24px; color: #555a4c">
                  Enter this code in babble to continue.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    padding: 16px;
                    background: #e1eecc;
                    color: #3d472b;
                    font-size: 28px;
                    font-weight: 700;
                    letter-spacing: 6px;
                    text-align: center;
                    border-radius: 12px;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0; font-size: 14px; line-height: 20px; color: #62675a">
                  If you didn't ask for this, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
