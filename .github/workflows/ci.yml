name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm turbo run typecheck test --filter='!@babble/db'
      - run: pnpm --filter @babble/web build

  database-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: packages/db
        run: pnpm exec supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - working-directory: packages/db
        run: pnpm exec supabase test db
      - working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: apps/web
        run: |
          cp .env.example .env
          sed -i 's/^BILLING_ENABLED=.*/BILLING_ENABLED=true/' .env
          echo "SUPABASE_SERVICE_ROLE_KEY=$(pnpm --dir ../../packages/db exec supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')" >> .env
          pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: babble-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, database-and-e2e, docker]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      fly-config: fly.toml
      url: https://babble.brenstrum.com
    secrets: inherit
