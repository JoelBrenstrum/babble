name: Deploy staging

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    concurrency:
      group: deploy-staging-${{ github.event.number || 'manual' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      fly-config: fly.staging.toml
      url: https://babble-staging.fly.dev
    secrets: inherit
